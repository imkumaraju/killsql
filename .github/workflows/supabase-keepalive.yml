# Ping Postgres via PostgREST so the Free-plan project is not paused.
# URL and anon key come from GitHub Actions secrets — not from this file.
name: Keep Supabase awake

on:
  schedule:
    - cron: "0 8 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Query profiles (SELECT via PostgREST)
        run: |
          set -euo pipefail
          set +x
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing GitHub Actions secrets SUPABASE_URL and/or SUPABASE_ANON_KEY"
            exit 1
          fi
          url="${SUPABASE_URL%/}/rest/v1/profiles?select=id&limit=1"
          curl -fsS --retry 3 --retry-delay 5 \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Accept: application/json" \
            "$url" >/dev/null
          echo "Keep-alive ping succeeded"
